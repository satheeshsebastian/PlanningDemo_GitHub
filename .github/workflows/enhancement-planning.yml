name: Enhancement Planning Workflow (Existing Feature)
description: >
  Updates BRD and user stories for EXISTING features. 
  Enhancement detector finds matching artifact, then enhancement-modifier updates it, 
  and enhancement-story-updater modifies/creates related stories.

on:
  workflow_dispatch:
  
jobs:
  enhancement-planning:
    runs-on: ubuntu-latest
    steps:
      - name: 1️⃣ Enhancement Detection
        uses: ./.github/skills/enhancement-detector
        with:
          workflow: enhancement
          purpose: "Find matching existing feature"
      
      - name: 2️⃣ Enhancement BRD Modifier
        uses: ./.github/skills/enhancement-modifier
        with:
          existing_brd: ${{ steps.enhancement-detection.outputs.matched_brd }}
          enhancement_input: ${{ github.event.inputs.enhancement }}
          version_strategy: "minor"
      
      - name: 3️⃣ Enhancement Story Updater
        uses: ./.github/skills/enhancement-story-updater
        with:
          updated_brd: ${{ steps.enhancement-brd-modifier.outputs.brd_path }}
          existing_stories: features/user-stories/
          brd_changelog: ${{ steps.enhancement-brd-modifier.outputs.changelog }}
      
      - name: 4️⃣ Update Functional Tests (Optional)
        uses: ./.github/skills/functional-test-writer
        if: ${{ github.event.inputs.update_tests == 'true' }}
        with:
          user_stories: ${{ steps.enhancement-story-updater.outputs.stories_path }}
          modified_stories_only: true
      
      - name: ✅ Summary
        run: |
          echo "✅ Enhancement Planning Complete"
          echo "📄 Updated BRD: ${{ steps.enhancement-brd-modifier.outputs.brd_path }}"
          echo "📋 Updated Stories: features/user-stories/"
          echo "🧪 Updated Tests: features/test-cases/ (if updated)"
          echo "📝 Changes: See features/CHANGELOG.md"
          echo "Next: Review changes, commit, and deploy"
